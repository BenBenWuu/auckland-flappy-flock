name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, apk-build ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate game HTML is present
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/game/index.html
          grep -q "Birdie Go" app/src/main/assets/game/index.html
          grep -q "requestAnimationFrame" app/src/main/assets/game/index.html
          echo "index.html bytes: $(wc -c < app/src/main/assets/game/index.html)"

      - name: Build corrected launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable
          base64 -d payload/icon.b64 > /tmp/icon-source.jpg
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from collections import deque
          from PIL import Image
          from pathlib import Path

          src = "/tmp/icon-source.jpg"
          dst = Path("app/src/main/res/drawable/ic_launcher.png")
          im = Image.open(src).convert("RGB")
          w,h = im.size
          px = im.load()
          seen = bytearray(w*h)
          q = deque()

          def whiteish(x,y):
              r,g,b = px[x,y]
              return r >= 200 and g >= 200 and b >= 200 and max(r,g,b)-min(r,g,b) <= 50

          for x in range(w):
              for y in (0,h-1):
                  if whiteish(x,y):
                      idx=y*w+x
                      if not seen[idx]:
                          seen[idx]=1
                          q.append((x,y))
          for y in range(h):
              for x in (0,w-1):
                  if whiteish(x,y):
                      idx=y*w+x
                      if not seen[idx]:
                          seen[idx]=1
                          q.append((x,y))

          while q:
              x,y=q.popleft()
              for nx,ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                  if 0 <= nx < w and 0 <= ny < h:
                      idx=ny*w+nx
                      if not seen[idx] and whiteish(nx,ny):
                          seen[idx]=1
                          q.append((nx,ny))

          fill=(93,201,240)
          for y in range(h):
              for x in range(w):
                  if seen[y*w+x]:
                      px[x,y]=fill

          # Slight crop removes any residual baked-in white rim, then resize.
          crop = max(1, int(min(w,h) * 0.035))
          im = im.crop((crop,crop,w-crop,h-crop))
          im = im.resize((384,384), Image.Resampling.LANCZOS)
          im.save(dst, optimize=True)
          print("launcher icon bytes:", dst.stat().st_size)
          PY

      - name: Patch manifest and version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          s = s.replace("@mipmap/ic_launcher", "@drawable/ic_launcher")
          manifest.write_text(s)

          adaptive = Path("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml")
          if adaptive.exists():
              adaptive.unlink()

          gradle = Path("app/build.gradle")
          g = gradle.read_text()
          g = g.replace("versionCode 1", "versionCode 3")
          g = g.replace("versionName '1.0'", "versionName '1.1.0'")
          gradle.write_text(g)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Validate APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*-debug.apk' | head -n 1)"
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          unzip -l "$APK" | tee /tmp/apk-list.txt
          grep -q 'assets/game/index.html' /tmp/apk-list.txt
          grep -q 'res/drawable/ic_launcher.png' /tmp/apk-list.txt
          unzip -p "$APK" assets/game/index.html | grep -q 'Birdie Go'
          unzip -p "$APK" assets/game/index.html | grep -q 'requestAnimationFrame'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 8

      - name: Rename APK
        shell: bash
        run: |
          cp "$APK" Birdie-Go-v1.1.0.apk
          ls -lh Birdie-Go-v1.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Birdie-Go-v1.1.0-APK
          path: Birdie-Go-v1.1.0.apk
          retention-days: 30
