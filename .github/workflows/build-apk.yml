name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, apk-build ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct compact Android project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          parts = [p.read_text().strip() for p in sorted(Path("compact").glob("chunk_*.b64"))]
          data = "".join(parts)
          raw = base64.b64decode(data, validate=False)
          Path("/tmp/project.zip").write_bytes(raw)
          print("decoded bytes:", len(raw))
          PY
          unzip -t /tmp/project.zip
          rm -rf /tmp/appsrc
          mkdir -p /tmp/appsrc
          unzip -q /tmp/project.zip -d /tmp/appsrc

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          PROJECT="$(find /tmp/appsrc -maxdepth 3 -name settings.gradle -printf '%h\n' | head -n 1)"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT"

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.project }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        shell: bash
        run: |
          APK="$(find "${{ steps.locate.outputs.project }}" -path '*/build/outputs/apk/debug/*-debug.apk' | head -n 1)"
          cp "$APK" Auckland-Flappy-Flock.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Auckland-Flappy-Flock-APK
          path: Auckland-Flappy-Flock.apk
          retention-days: 30
