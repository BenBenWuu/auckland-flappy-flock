name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, apk-build ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore game images and launcher icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/game/assets
          mkdir -p app/src/main/res/drawable
          base64 -d payload/peach.b64 > app/src/main/assets/game/assets/peach.jpg
          base64 -d payload/hope.b64 > app/src/main/assets/game/assets/hope.jpg
          base64 -d payload/dreamy.b64 > app/src/main/assets/game/assets/dreamy.jpg
          base64 -d payload/xiaotaiyang.b64 > app/src/main/assets/game/assets/xiaotaiyang.jpg
          base64 -d payload/auckland_bg.b64 > app/src/main/assets/game/assets/auckland_bg.png
          base64 -d payload/icon.b64 > app/src/main/res/drawable/ic_launcher.jpg
          test -s app/src/main/assets/game/assets/peach.jpg
          test -s app/src/main/assets/game/assets/hope.jpg
          test -s app/src/main/assets/game/assets/dreamy.jpg
          test -s app/src/main/assets/game/assets/xiaotaiyang.jpg
          test -s app/src/main/assets/game/assets/auckland_bg.png
          test -s app/src/main/res/drawable/ic_launcher.jpg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        shell: bash
        run: |
          set -e
          APK="$(find app/build/outputs/apk/debug -name '*-debug.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" Auckland-Flappy-Flock.apk
          ls -lh Auckland-Flappy-Flock.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Auckland-Flappy-Flock-APK
          path: Auckland-Flappy-Flock.apk
          retention-days: 30
