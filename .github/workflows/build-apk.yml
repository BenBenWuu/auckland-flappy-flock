name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          parts = []
          for p in sorted(Path("bundle").glob("chunk_*.b64")):
              parts.append(p.read_text())
          data = "".join(parts)
          raw = base64.b64decode(data, validate=False)
          Path("/tmp/project.zip").write_bytes(raw)
          print("decoded bytes:", len(raw))
          PY
          unzip -t /tmp/project.zip
          mkdir -p /tmp/appsrc
          unzip -q /tmp/project.zip -d /tmp/appsrc

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: /tmp/appsrc/auckland_flappy_flock_android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp /tmp/appsrc/auckland_flappy_flock_android/app/build/outputs/apk/debug/app-debug.apk Auckland-Flappy-Flock.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Auckland-Flappy-Flock-APK
          path: Auckland-Flappy-Flock.apk
          retention-days: 30
