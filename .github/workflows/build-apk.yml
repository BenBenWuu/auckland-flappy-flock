name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        run: |
          cat bundle/chunk_*.b64 | tr -d '[:space:]' > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.zip
          echo "d987b0230875c1a3b5e3d82cd507b608f45fb94ad75c4c0f14c17f2be2b52c08  /tmp/project.zip" | sha256sum -c -
          unzip -t /tmp/project.zip
          mkdir -p /tmp/appsrc
          unzip -q /tmp/project.zip -d /tmp/appsrc

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: /tmp/appsrc/auckland_flappy_flock_android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp /tmp/appsrc/auckland_flappy_flock_android/app/build/outputs/apk/debug/app-debug.apk Auckland-Flappy-Flock.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Auckland-Flappy-Flock-APK
          path: Auckland-Flappy-Flock.apk
          retention-days: 30
